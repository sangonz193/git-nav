[package]
name = "git-nav"
version = "0.0.11"
description = "Read Git history, worktrees and diffs"
authors = ["Santiago González <37671738+sangonz193@users.noreply.github.com>"]
repository = "https://github.com/sangonz193/git-nav"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "git_nav_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
git-nav-macros = { path = "macros" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
url = "2"
getrandom = "0.3"
if-addrs = "0.15"
axum = "0.8"
dirs = "6"
futures-util = "0.3"
fs2 = "0.4"
mime_guess = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.11.0"
tauri-plugin-window-state = "2.4.1"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = "0.61"
