name: Pull Request

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      tauri: ${{ steps.filter.outputs.tauri }}

    steps:
      - uses: actions/checkout@v7

      - id: filter
        run: |
          git fetch --quiet --depth=1 origin "${{ github.base_ref }}"
          if git diff --quiet "origin/${{ github.base_ref }}" HEAD -- apps/desktop/src-tauri; then
            echo "tauri=false" >> "$GITHUB_OUTPUT"
          else
            echo "tauri=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run format:check

      - run: bun run lint

      - run: bun run test

  macos-check:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.tauri == 'true') }}
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: cargo test
        working-directory: apps/desktop/src-tauri

  linux-check:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.tauri == 'true') }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - run: cargo check
        working-directory: apps/desktop/src-tauri

  windows-check:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.tauri == 'true') }}
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: cargo test --target x86_64-pc-windows-msvc
        working-directory: apps/desktop/src-tauri
