name: Pull Request

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      - run: bun run test

  macos-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - run: cargo test
        working-directory: apps/desktop/src-tauri

  linux-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - run: cargo check
        working-directory: apps/desktop/src-tauri

  windows-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - run: cargo check --target x86_64-pc-windows-msvc
        working-directory: apps/desktop/src-tauri
