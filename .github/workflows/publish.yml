name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: xcode-27
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: win32-x64
            runner: windows-2025
          - platform: win32-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run format:check

      - run: bun run lint

      - run: bun run test

      - run: cargo test
        working-directory: apps/desktop/src-tauri

      - run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME"
          test "$version" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)"
          test "$version" = "$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
        shell: bash

      # Xcode 27's codesign cannot resolve an identity by its non-ASCII name, so the
      # certificate is imported here and handed to Tauri by hash instead of by name.
      - if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -k "$keychain" \
            -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$certificate"

          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
        shell: bash

      - run: bun run build:package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - if: runner.os == 'Linux'
        run: scripts/appimage-smoke.sh packages/cli/dist/packages/${{ matrix.platform }}/git-nav.AppImage

      # Tauri notarizes and staples the app it bundles, leaving the disk image around it unnotarized,
      # which is what a download is assessed as when it is opened.
      - if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for image in apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$image" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$image"
            xcrun stapler validate "$image"
          done
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/release/bundle
          if-no-files-found: error
          retention-days: 1

      # A re-run of a partially failed release skips the packages it already published.
      - run: |
          package="$(node -p "p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$package" version >/dev/null 2>&1; then
            echo "$package is already published"
          else
            npm publish --access public
          fi
        working-directory: packages/cli/dist/packages/${{ matrix.platform }}
        shell: bash

  publish-cli:
    needs: publish-platform
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - run: |
          package="$(node -p "p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$package" version >/dev/null 2>&1; then
            echo "$package is already published"
          else
            npm publish --access public
          fi
        working-directory: packages/cli

  publish-release:
    if: github.event.repository.private == false
    needs: [publish-platform, publish-cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - run: bun scripts/create-update-release.ts artifacts release "$GITHUB_REF_NAME"

      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes release/*
